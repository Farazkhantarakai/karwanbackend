spring:
  application:
    name: Karwan-Stag
  datasource:
    url: jdbc:postgresql://localhost:5432/karwan
    username: ${DB_NAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SIGNATURE_KEY}
    access-token-expiration-ms: ${ACCESS_TOKEN_EXPIRY_SECONDS}
    refresh-token-expiration-ms: ${REFRESH_TOKEN_EXPIRY_SECONDS}
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000
