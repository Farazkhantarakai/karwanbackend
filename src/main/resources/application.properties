spring.application.name=camp
server.port=8080

# Database Configuration (PostgreSQL - Database Name: karwan)
spring.datasource.url=jdbc:postgresql://localhost:5432/karwan
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=9a2f8c4e7b1d3f5a6c8e0b2d4f6a8c1e3b5d7f9a2c4e6b8d0e2f4a6c8b0d2e4f
app.jwt.access-token-expiration-ms=3600000
app.jwt.refresh-token-expiration-ms=604800000

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# Google OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=1054948831613-mockclientidkarwanecommerce.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
