spring:
  application:
    name: Karwan

  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/karwan
    username: ${DB_NAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
#        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}

server:
  port: 8080

logging:
  level:
    org.hibernate.tool.schema: debug
    org.hibernate.SQL: debug

mail:
  key: ${MAIL_SENDER_API_KEY}
brevo-url: https://api.brevo.com/v3/smtp/email
platform-mail: farazkhantaraka@gmail.com
platform-name: Karwan Commerce OS

app-domain-suffix: .karwan.pk

cloudflare:
  r2:
    bucket: ${CLOUDFLARE_R2_BUCKET:karwan-media}
    endpoint: ${CLOUD_FLARE_API_KEY}
    access-key: ${CLOUD_FLARE_ACCESS_KEY:}
    secret-key: ${CLOUD_FLARE_SECRET_KEY:}
    public-domain: ${CLOUDFLARE_R2_PUBLIC_DOMAIN:}

app:
  jwt:
    secret: ${JWT_SIGNATURE_KEY}
    access-token-expiration-ms: ${ACCESS_TOKEN_EXPIRY_SECONDS}
    refresh-token-expiration-ms: ${REFRESH_TOKEN_EXPIRY_SECONDS}
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000
